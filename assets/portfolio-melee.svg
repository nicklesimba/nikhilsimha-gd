<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgMelee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120a1f"/>
      <stop offset="55%" stop-color="#1d1030"/>
      <stop offset="100%" stop-color="#2a1240"/>
    </linearGradient>
    <linearGradient id="slash1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f6d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8a5c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slash2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ad1ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a5c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgMelee)"/>

  <!-- particle dots -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="120" cy="140" r="2"/>
    <circle cx="260" cy="80" r="1.5"/>
    <circle cx="1380" cy="120" r="2"/>
    <circle cx="1480" cy="260" r="1.5"/>
    <circle cx="1420" cy="700" r="2"/>
    <circle cx="180" cy="740" r="1.5"/>
    <circle cx="90" cy="500" r="1.5"/>
    <circle cx="1520" cy="500" r="2"/>
  </g>

  <!-- glow behind figure -->
  <ellipse cx="800" cy="500" rx="420" ry="340" fill="url(#glow)" filter="url(#blurSoft)"/>

  <!-- ground plane -->
  <polygon points="0,760 1600,760 1600,900 0,900" fill="#0b0614" opacity="0.7"/>
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#ff8a5c" stroke-opacity="0.25" stroke-width="2"/>

  <!-- silhouette figure mid-swing -->
  <g fill="#0c0714">
    <ellipse cx="780" cy="560" rx="52" ry="68"/>
    <path d="M745 460 q35 -30 70 0 l-10 90 q-25 20 -55 0 z"/>
    <circle cx="778" cy="430" r="30"/>
    <path d="M810 480 q120 -60 210 -150 q10 20 -6 40 q-90 90 -190 140 z"/>
    <path d="M740 500 q-60 40 -110 30 q-4 -18 10 -28 q60 -18 96 -34 z"/>
    <rect x="750" y="620" width="26" height="120" rx="10"/>
    <rect x="800" y="620" width="26" height="120" rx="10"/>
  </g>

  <!-- weapon arc slashes -->
  <path d="M980 320 Q1180 420 1040 620" stroke="url(#slash1)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M1010 300 Q1230 410 1070 640" stroke="url(#slash2)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M960 350 Q1120 430 1010 580" stroke="url(#slash1)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- frame corner accents -->
  <g stroke="#ffd166" stroke-width="2" opacity="0.5">
    <path d="M40 40 h60 M40 40 v60" fill="none"/>
    <path d="M1560 40 h-60 M1560 40 v60" fill="none"/>
    <path d="M40 860 h60 M40 860 v-60" fill="none"/>
    <path d="M1560 860 h-60 M1560 860 v-60" fill="none"/>
  </g>
</svg>
