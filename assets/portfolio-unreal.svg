<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgUnreal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a"/>
      <stop offset="55%" stop-color="#071b28"/>
      <stop offset="100%" stop-color="#0a2536"/>
    </linearGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33e1ff"/>
      <stop offset="100%" stop-color="#5ad1ff"/>
    </linearGradient>
    <linearGradient id="node2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cffb2"/>
      <stop offset="100%" stop-color="#33e1ff"/>
    </linearGradient>
    <radialGradient id="glowUnreal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33e1ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#33e1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#1a3a4a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgUnreal)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.5"/>

  <ellipse cx="820" cy="460" rx="460" ry="320" fill="url(#glowUnreal)" filter="url(#blurSoft2)"/>

  <!-- blueprint node graph -->
  <g stroke-width="2" fill="none" opacity="0.9">
    <path d="M300 260 C 420 260, 420 340, 540 340" stroke="url(#node1)"/>
    <path d="M540 340 C 660 340, 660 220, 780 220" stroke="url(#node2)"/>
    <path d="M540 340 C 660 340, 660 460, 780 460" stroke="url(#node1)"/>
    <path d="M780 460 C 900 460, 900 560, 1020 560" stroke="url(#node2)"/>
    <path d="M780 220 C 900 220, 900 380, 1020 380" stroke="url(#node1)"/>
    <path d="M1020 380 C 1140 380, 1140 480, 1260 480" stroke="url(#node2)"/>
    <path d="M1020 560 C 1140 560, 1140 500, 1260 480" stroke="url(#node1)"/>
  </g>

  <!-- nodes -->
  <g>
    <g transform="translate(260,238)">
      <rect width="120" height="44" rx="8" fill="#0c2230" stroke="#33e1ff" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#33e1ff"/>
      <circle cx="120" cy="22" r="4" fill="#33e1ff"/>
    </g>
    <g transform="translate(500,318)">
      <rect width="130" height="44" rx="8" fill="#0c2230" stroke="#5ad1ff" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#5ad1ff"/>
      <circle cx="130" cy="22" r="4" fill="#5ad1ff"/>
    </g>
    <g transform="translate(740,198)">
      <rect width="130" height="44" rx="8" fill="#0c2230" stroke="#7cffb2" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#7cffb2"/>
      <circle cx="130" cy="22" r="4" fill="#7cffb2"/>
    </g>
    <g transform="translate(740,438)">
      <rect width="130" height="44" rx="8" fill="#0c2230" stroke="#33e1ff" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#33e1ff"/>
      <circle cx="130" cy="22" r="4" fill="#33e1ff"/>
    </g>
    <g transform="translate(980,360)">
      <rect width="130" height="44" rx="8" fill="#0c2230" stroke="#5ad1ff" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#5ad1ff"/>
      <circle cx="130" cy="22" r="4" fill="#5ad1ff"/>
    </g>
    <g transform="translate(980,538)">
      <rect width="130" height="44" rx="8" fill="#0c2230" stroke="#7cffb2" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="4" fill="#7cffb2"/>
      <circle cx="130" cy="22" r="4" fill="#7cffb2"/>
    </g>
    <g transform="translate(1220,460)">
      <rect width="150" height="50" rx="8" fill="#0c2230" stroke="#33e1ff" stroke-width="2"/>
      <circle cx="0" cy="25" r="4" fill="#33e1ff"/>
    </g>
  </g>

  <!-- corner accents -->
  <g stroke="#33e1ff" stroke-width="2" opacity="0.5">
    <path d="M40 40 h60 M40 40 v60" fill="none"/>
    <path d="M1560 40 h-60 M1560 40 v60" fill="none"/>
    <path d="M40 860 h60 M40 860 v-60" fill="none"/>
    <path d="M1560 860 h-60 M1560 860 v-60" fill="none"/>
  </g>
</svg>
